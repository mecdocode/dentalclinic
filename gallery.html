<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Before & After Gallery | Infinity Dental Clinic Indore</title>
  <meta name="description" content="View real patient before and after results for dental implants, smile makeovers, braces, and teeth whitening at Infinity Dental Clinic, Indore.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=DM+Sans:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Dentist",
    "name": "Infinity Dental Clinic",
    "description": "Expert dental implants and smile makeover clinic in Vijay Nagar, Indore. Dr. Anmol Billore — MCI Verified Implantologist with 16+ years experience.",
    "url": "https://dentalcheck.netlify.app",
    "telephone": "+91-XXXXXXXXXX",
    "email": "info@infinitydental.in",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "34, Scheme No. 54, Vijay Nagar",
      "addressLocality": "Indore",
      "addressRegion": "Madhya Pradesh",
      "postalCode": "452010",
      "addressCountry": "IN"
    },
    "geo": {
      "@type": "GeoCoordinates",
      "latitude": "22.7533",
      "longitude": "75.8937"
    },
    "openingHoursSpecification": [
      {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
        "opens": "09:00",
        "closes": "13:00"
      },
      {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
        "opens": "17:00",
        "closes": "21:00"
      },
      {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Sunday"],
        "opens": "10:00",
        "closes": "13:00"
      }
    ],
    "aggregateRating": {
      "@type": "AggregateRating",
      "ratingValue": "4.9",
      "reviewCount": "200",
      "bestRating": "5"
    },
    "medicalSpecialty": "Dentistry",
    "availableService": [
      { "@type": "MedicalProcedure", "name": "Dental Implants" },
      { "@type": "MedicalProcedure", "name": "Smile Makeover" },
      { "@type": "MedicalProcedure", "name": "Root Canal Treatment" },
      { "@type": "MedicalProcedure", "name": "Teeth Whitening" }
    ]
  }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/img-comparison-slider@8/dist/index.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/img-comparison-slider@8/dist/styles.css" />
</head>
<body>

  <!-- Page Hero -->
  <section class="page-hero" id="main-content">
    <div class="container">
      <div class="breadcrumb">
        <a href="index.html">Home</a>
        <span>›</span>
        <span>Gallery</span>
      </div>
      <h1>Patient Transformations</h1>
      <p>Real results from real patients — before and after comparisons that speak for themselves.</p>
    </div>
  </section>

  <!-- Gallery -->
  <section class="section" style="background:var(--mist);">
    <div class="container">

      <!-- Filters -->
      <div class="filter-tabs" id="gallery-filters" role="tablist">
        <button class="filter-tab active" data-filter="all">All Cases</button>
        <button class="filter-tab" data-filter="Smile Makeover">Smile Makeover</button>
        <button class="filter-tab" data-filter="Implants">Implants</button>
        <button class="filter-tab" data-filter="Braces">Braces</button>
        <button class="filter-tab" data-filter="Whitening">Whitening</button>
      </div>

      <!-- Grid -->
      <div class="gallery-grid" id="gallery-grid">
        <!-- Injected by cms-bridge.js -->
        <div class="gallery-item" style="opacity:0.3;background:var(--ice);height:260px;display:flex;align-items:center;justify-content:center;font-size:2rem;"></div>
      </div>
    </div>
  </section>

  <!-- CTA -->
  <section class="cta-banner">
    <div class="container">
      <h2>Want Results Like These? </h2>
      <p>Book a consultation to discuss your smile transformation with Dr. Anmol Billore.</p>
      <div class="cta-actions">
        <a href="contact.html#appointment" class="btn btn-ghost-white" id="gal-book-btn">Book Consultation</a>
        <a href="https://wa.me/91XXXXXXXXXX" target="_blank" rel="noopener" class="btn btn-whatsapp" id="gal-wa-btn" aria-label="Chat on WhatsApp (opens WhatsApp app)" rel="noopener noreferrer" target="_blank">
  <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M11.996 0C5.372 0 0 5.372 0 11.996c0 2.126.549 4.12 1.554 5.865L.012 24l6.324-1.523A11.936 11.936 0 0 0 11.996 24c6.623 0 11.996-5.372 11.996-11.996h-.002A11.996 11.996 0 0 0 11.996 0z" /></svg>
  WhatsApp Us
  <svg aria-hidden="true" class="external-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
</a>
      </div>
    </div>
  </section>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image lightbox">
    <div class="lightbox-inner">
      <button class="lightbox-close" onclick="closeLightbox()" aria-label="Close lightbox">✕</button>
      <button class="lightbox-prev" onclick="lightboxNav(-1)" aria-label="Previous">‹</button>
      <img class="lightbox-img" id="lightbox-img" src="" alt="" loading="lazy">
      <button class="lightbox-next" onclick="lightboxNav(1)" aria-label="Next">›</button>
    </div>
  </div>

  <script src="js/main.js" defer></script>
  <script src="js/cms-bridge.js" defer></script>

  <!-- Mobile Sticky CTA Bar -->
  <div class="mobile-cta-bar">
    <a href="contact.html#appointment" class="btn-book">Book Appointment</a>
    <a href="https://wa.me/91XXXXXXXXXX" class="btn-wa">WhatsApp</a>
  </div>
</body>
</html>
