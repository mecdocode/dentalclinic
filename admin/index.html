<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinity Dental — Admin Panel</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // ── Netlify Identity Redirect ─────────────────────────────
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }

    // ── Admin-side Image Validation ───────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      function showToast(msg) {
        const toast = document.createElement('div');
        toast.style.cssText = `
          position: fixed; bottom: 20px; right: 20px; background: #ef4444; color: white;
          padding: 12px 20px; border-radius: 8px; font-family: sans-serif; font-size: 14px;
          box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); z-index: 9999;
          transform: translateY(100%); opacity: 0; transition: transform 0.3s ease, opacity 0.3s ease;
        `;
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => { toast.style.transform = 'translateY(0)'; toast.style.opacity = '1'; }, 100);
        setTimeout(() => {
          toast.style.transform = 'translateY(100%)'; toast.style.opacity = '0';
          setTimeout(() => toast.remove(), 300);
        }, 5000);
      }

      document.body.addEventListener('change', (e) => {
        if (e.target.type !== 'file') return;
        const file = e.target.files[0];
        if (!file || !file.type.startsWith('image/')) return;
        const sizeKB = Math.round(file.size / 1024);
        if (sizeKB > 600) {
          showToast(`⚠️ WARNING: Image is ${sizeKB}KB! Recommended max is 600KB.`);
        }
        const img = new Image();
        img.onload = () => {
          if (img.width < 600 || img.height < 400) {
            showToast(`⚠️ WARNING: Image is only ${img.width}×${img.height}px.`);
          }
        };
        img.src = URL.createObjectURL(file);
      }, true);
    });
  </script>
</body>
</html>
